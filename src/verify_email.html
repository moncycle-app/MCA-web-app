		<link rel="stylesheet" href="css/account.css" />
		<style>
			.contennu {
				max-width: 370px;
			}
		</style>
	</head>
	<body>
		<center>
			<h1>mon<span class="gradiant_logo">cycle</span>.app</h1>
			<a href="auth"><button data-i18n="verify_email.se_connecter" type="button" class="nav_button"></button></a>
		</center>

		<!-- The link of a mail (js/verify_email.js): the purpose and the token are in the fragment of the address. The form below carries them to the API. -->
		<div class="contennu" id="et_form_box" style="display:none">
			<h2 id="et_title"></h2>
			<form action="api/v2/verify_email" method="post" id="f_verify_email"><br />
				<input type="hidden" name="purpose" id="i_purpose" value="" />
				<input type="hidden" name="token" id="i_token" value="" />
				<span id="et_text"></span><br />
				<br />
				<div id="et_password_block" style="display:none">
					<label data-i18n="verify_email.nouveau_mot_de_passe" for="i_new_password"></label><br />
					<input data-i18n-attr="placeholder:verify_email.choisir_un_mot_de_passe" name="new_password" id="i_new_password" type="password" autocomplete="new-password" /><br />
					<span data-i18n="verify_email.10_caracteres_au_moins_avec_une" class="label_info"></span><br />
					<br />
					<label data-i18n="verify_email.confirmer_re_saisir_le_mot_de_passe" for="i_new_password_conf"></label><br />
					<input data-i18n-attr="placeholder:verify_email.entrer_une_2eme_fois_le_mot_de_passe" name="new_password_conf" id="i_new_password_conf" type="password" autocomplete="new-password" /><br />
					<br />
				</div>
				<span class="rouge" id="et_error_msg"></span><br />
				<input type="submit" id="but_et" value="" />
			</form>
		</div>
		<div class="contennu vert" id="et_done" style="display:none">
			<center>
				<br /><br />
				<b id="et_done_text"></b><br />
				<br />
				<a id="et_login_link" href="auth"><button data-i18n="verify_email.se_connecter" type="button" class="nav_button"></button></a>
			</center>
		</div>
		<div class="contennu" id="et_invalid" style="display:none">
			<center data-i18n="verify_email.il_a_peut_etre_deja_servi_expire_ou_ete"><br data-slot="br" /><br data-slot="br2" /><span data-i18n="verify_email.ce_lien_n_est_pas_valide" data-slot="span" class="rouge"></span><br data-slot="br3" /><br data-slot="br4" /></center>
		</div>
	</body>
</html>
