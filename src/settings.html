	<body>
		<center>
			<h1>mon<span class="gradiant_logo">cycle</span>.app</h1>
			<div data-i18n="settings.reglages" id="name"></div>
			<a href="/"><button data-i18n="settings.revenir_aux_cycles" type="button" class="nav_button"></button></a>
			<form id="f_logout" action="api/v2/token" method="delete"><button data-i18n="settings.deconnexion" type="submit" id="but_logout" class="nav_button rouge"></button></form>
			<p data-i18n="settings.vous_visualisez_actuellement_le_compte" id="warning_demo" hidden><br data-slot="br" /><br data-slot="br2" /><a data-slot="a" href="/register"><button data-i18n="settings.creer_votre_compte" type="button"></button></a></p>
		</center>

		<div class="contennu settings">
			<p class="form_msg" id="page_msg" role="status"></p>
			<br />

			<!-- ===== The menu: one entry per panel below. A panel opens with the address #name (settings#securite). ===== -->
			<nav id="menu">
				<h2 data-i18n="settings.reglages"></h2>
				<a class="menu_item" id="menu_suivi" href="#suivi">
					<span data-i18n="settings.icon" class="menu_icon"></span>
					<span class="menu_text"><b data-i18n="settings.mon_suivi"></b><small data-i18n="settings.pseudo_methode_temperature_affichage"></small></span>
				</a>
				<a class="menu_item" id="menu_descriptions" href="#descriptions">
					<span data-i18n="settings.icon_2" class="menu_icon"></span>
					<span class="menu_text"><b data-i18n="settings.sensations_observations"></b><small data-i18n="settings.vos_mots_cles_renommer_classer"></small></span>
				</a>
				<a class="menu_item" id="menu_notifications" href="#notifications">
					<span data-i18n="settings.icon_3" class="menu_icon"></span>
					<span class="menu_text"><b data-i18n="settings.cycles_par_e_mail"></b><small data-i18n="settings.recevoir_chaque_cycle_termine_et_ou"></small></span>
				</a>
				<a class="menu_item" id="menu_donnees" href="#donnees">
					<span data-i18n="settings.icon_4" class="menu_icon"></span>
					<span class="menu_text"><b data-i18n="settings.mes_donnees"></b><small data-i18n="settings.exporter_pdf_csv_nfp_importer"></small></span>
				</a>
				<a class="menu_item" id="menu_connexion" href="#connexion">
					<span data-i18n="settings.icon_5" class="menu_icon"></span>
					<span class="menu_text"><b data-i18n="settings.connexion_et_securite"></b><small data-i18n="settings.adresse_mot_de_passe_double"></small></span>
				</a>
				<a class="menu_item" id="menu_appareils" href="#appareils">
					<span data-i18n="settings.icon_6" class="menu_icon"></span>
					<span class="menu_text"><b data-i18n="settings.appareils_et_acces"></b><small data-i18n="settings.vos_connexions_jetons_d_acces"></small></span>
				</a>
				<a class="menu_item" id="menu_apropos" href="#apropos">
					<span data-i18n="settings.i" class="menu_icon"></span>
					<span class="menu_text"><b data-i18n="settings.a_propos_et_contact"></b><small data-i18n="settings.l_application_vos_conditions_nous"></small></span>
				</a>
				<a class="menu_item" id="menu_actualites" href="#actualites" hidden>
					<span data-i18n="settings.icon_7" class="menu_icon"></span>
					<span class="menu_text"><b data-i18n="settings.tech_4_fertility_actualites"></b><small data-i18n="settings.la_derniere_nouvelle_de_l_association"></small></span>
				</a>
				<a class="menu_item menu_danger" id="menu_suppression" href="#suppression">
					<span data-i18n="settings.icon_8" class="menu_icon"></span>
					<span class="menu_text"><b data-i18n="settings.supprimer_mon_compte"></b><small data-i18n="settings.effacer_definitivement_toutes_vos"></small></span>
				</a>
			</nav>


			<!-- ===== Mon suivi: every control saves by itself ===== -->
			<section class="panel" id="panel_suivi" hidden>
				<a data-i18n="settings.reglages_2" class="back" href="#"></a>
				<h2 data-i18n="settings.mon_suivi_2"></h2>
				<p data-i18n="settings.chaque_changement_est_enregistre_des" class="label_info"></p>

				<form id="f_suivi">
					<div class="field">
						<label data-i18n="settings.pseudo" for="i_nickname"></label>
						<input type="text" id="i_nickname" name="nickname" required maxlength="255" autocomplete="off" />
						<span data-i18n="settings.vos_initiales_suffisent_ne_saisissez" class="label_info"></span>
						<p class="form_msg" role="status"></p>
					</div>

					<fieldset class="choice_group">
						<legend data-i18n="settings.votre_methode"></legend>
						<span data-i18n="settings.modifier_ce_choix_ne_genere_aucune" class="label_info"></span>
						<div class="choice">
							<input type="radio" name="method" value="cervicalMucus" id="m_cervical_mucus" required />
							<label for="m_cervical_mucus">
								<span data-i18n="settings.auto_observation_de_la_glaire_cervicale" class="choice_title"></span>
								<span data-i18n="settings.vous_notez_chaque_jour_la_sensation_et" class="choice_text"></span>
								<span data-i18n="settings.selon_les_publications_des_docteurs" class="choice_note"></span>
							</label>
						</div>
						<div class="choice">
							<input type="radio" name="method" value="fertilityCare" id="m_fertility_care" />
							<label for="m_fertility_care">
								<span data-i18n="settings.fertilitycare" class="choice_title"></span>
								<span data-i18n="settings.vous_suivez_la_glaire_cervicale_avec_la" class="choice_text"></span>
							</label>
						</div>
						<p class="form_msg" role="status"></p>
					</fieldset>

					<fieldset class="choice_group">
						<legend data-i18n="settings.en_option"></legend>
						<div class="choice choice_check">
							<input type="checkbox" name="temperature_tracking" value="1" id="m_temp" />
							<label for="m_temp">
								<span data-i18n="settings.suivre_aussi_ma_temperature" class="choice_title"></span>
								<span data-i18n="settings.vous_saisissez_votre_temperature" class="choice_text"></span>
							</label>
						</div>
						<span data-i18n="settings.vous_suivez_une_methode_symptothermique" class="label_info choice_hint"></span>
						<p class="form_msg" role="status"></p>
					</fieldset>

					<fieldset class="choice_group">
						<legend data-i18n="settings.affichage_du_tableau"></legend>
						<div class="choice choice_check">
							<input type="checkbox" name="timeline_asc" value="1" id="i_timeline_asc" />
							<label for="i_timeline_asc">
								<span data-i18n="settings.dates_en_ordre_croissant" class="choice_title"></span>
								<span data-i18n="settings.aujourd_hui_en_premier_les_dates_les" class="choice_text"></span>
							</label>
						</div>
						<p class="form_msg" role="status"></p>
					</fieldset>

					<fieldset class="choice_group">
						<legend data-i18n="settings.a_votre_sujet"></legend>
						<div class="field">
							<label data-i18n="settings.annee_de_naissance" for="i_anaissance"></label>
							<select id="i_anaissance" name="age" required></select>
							<p class="form_msg" role="status"></p>
						</div>
						<div class="choice choice_check">
							<input type="checkbox" name="research" value="1" id="i_research" />
							<label for="i_research">
								<span data-i18n="settings.participer_a_la_recherche" class="choice_title"></span>
								<span data-i18n="settings.autoriser_des_exports_de_la_base_de" class="choice_text"></span>
							</label>
						</div>
						<p class="form_msg" role="status"></p>
					</fieldset>
				</form>
			</section>


			<!-- ===== Sensations & observations ===== -->
			<section class="panel" id="panel_descriptions" hidden>
				<a data-i18n="settings.reglages_2" class="back" href="#"></a>
				<h2 data-i18n="settings.sensations_observations_2"></h2>
				<p data-i18n="settings.ce_sont_les_mots_cles_que_vous_cochez"></p>

				<p class="desc_unknown_note label_info" hidden></p>
				<div id="desc_froms_container"><center data-i18n="settings.icon_9"></center></div>
				<p class="form_msg" id="desc_msg" role="status"></p>

				<h3 data-i18n="settings.creer_un_mot_cle"></h3>
				<form method="post" action="api/v2/description" id="f_new_description" class="inline_row">
					<input data-i18n-attr="placeholder:settings.nouveau_mot_cle;aria-label:settings.nom_du_nouveau_mot_cle" id="i_desc_name_new" type="text" name="name" maxlength="256" required />
					<select data-i18n-attr="aria-label:settings.type" id="i_desc_type_new" name="type">
						<option data-i18n="settings.sensation" value="2"></option>
						<option data-i18n="settings.observation" value="1"></option>
					</select>
					<button data-i18n="settings.ajouter" type="submit" id="i_desc_validate_new"></button>
					<p class="form_msg" role="status"></p>
				</form>

				<details class="help">
					<summary data-i18n="settings.que_font_les_boutons_d_un_mot_cle"></summary>
					<p data-i18n="settings.le_bouton_deplace_le_mot_cle_dans_le"><b data-i18n="settings.icon_10" data-slot="b"></b><b data-i18n="settings.icon_11" data-slot="b2"></b><b data-i18n="settings.icon_12" data-slot="b3"></b></p>
				</details>
			</section>


			<!-- ===== Cycles par e-mail ===== -->
			<section class="panel" id="panel_notifications" hidden>
				<a data-i18n="settings.reglages_2" class="back" href="#"></a>
				<h2 data-i18n="settings.cycles_par_e_mail_2"></h2>

				<form id="f_auto_mail">
					<div class="choice choice_check">
						<input type="checkbox" name="auto_mail_export" value="1" id="i_auto_mail_export" />
						<label for="i_auto_mail_export">
							<span data-i18n="settings.recevoir_chaque_cycle_par_e_mail" class="choice_title"></span>
							<span data-i18n="settings.a_la_fin_de_chaque_cycle_d_au_moins_5" class="choice_text"></span>
						</label>
					</div>
					<p class="form_msg" role="status"></p>
				</form>

				<h3 data-i18n="settings.adresses_qui_les_recoivent"></h3>
				<p data-i18n="settings.vos_cycles_sont_envoyes_a_votre_adresse" class="label_info"></p>
				<form id="form_notification_emails" action="api/v2/account" method="post">
					<div class="field">
						<label data-i18n="settings.autres_adresses" for="i_notification_emails"></label>
						<input data-i18n-attr="placeholder:settings.adresse1_exemple_fr_adresse2_exemple_fr" type="text" id="i_notification_emails" name="notification_emails" maxlength="1024" autocomplete="off" />
						<span data-i18n="settings.separees_par_5_au_plus_n_utilisez_pas_d" class="label_info"></span>
					</div>
					<div class="field">
						<label data-i18n="settings.mot_de_passe_pour_confirmer" for="i_notification_emails_password"></label>
						<input type="password" id="i_notification_emails_password" name="password" autocomplete="current-password" required />
						<span data-i18n="settings.un_mail_previent_votre_adresse_de" class="label_info"></span>
					</div>
					<button data-i18n="settings.enregistrer" type="submit" id="but_notification_emails"></button>
					<p class="form_msg" role="status"></p>
				</form>
			</section>


			<!-- ===== Mes données: export, import ===== -->
			<section class="panel" id="panel_donnees" hidden>
				<a data-i18n="settings.reglages_2" class="back" href="#"></a>
				<h2 data-i18n="settings.mes_donnees_2"></h2>

				<h3 data-i18n="settings.exporter_mes_observations"></h3>
				<p data-i18n="settings.tout_ou_partie_de_vos_observations" class="label_info"></p>
				<p class="desc_unknown_note label_info" hidden></p>
				<form method="get" action="api/v2/export" id="f_export_complexe">
					<div class="field_row">
						<div class="field">
							<label data-i18n="settings.du" for="i_start_date"></label>
							<input id="i_start_date" name="from" type="date" />
						</div>
						<div class="field">
							<label data-i18n="settings.au" for="i_end_date"></label>
							<input id="i_end_date" name="to" type="date" />
						</div>
					</div>
					<p data-i18n="settings.votre_plus_ancienne_observation_date_du" id="export_oldest" class="label_info" hidden><b data-slot="b" id="export_oldest_day"></b><button data-i18n="settings.tout_selectionner" data-slot="button" type="button" id="but_export_all" class="link_button"></button></p>

					<fieldset class="choice_group">
						<legend data-i18n="settings.format"></legend>
						<div class="choice">
							<input type="radio" name="format" value="pdf" id="f_pdf" checked />
							<label for="f_pdf">
								<span data-i18n="settings.pdf" class="choice_title"></span>
								<span data-i18n="settings.pour_partager_visuellement_vos_cycles" class="choice_text"></span>
							</label>
						</div>
						<div class="choice">
							<input type="radio" name="format" value="csv" id="f_csv" />
							<label for="f_csv">
								<span data-i18n="settings.csv" class="choice_title"></span>
								<span data-i18n="settings.pour_les_ouvrir_dans_libreoffice_ou" class="choice_text"></span>
							</label>
						</div>
						<div class="choice">
							<input type="radio" name="format" value="nfp" id="f_nfp" />
							<label for="f_nfp">
								<span data-i18n="settings.nfp" class="choice_title"></span>
								<span data-i18n="settings.pour_les_reimporter_plus_tard_dans_l" class="choice_text"></span>
							</label>
						</div>
					</fieldset>

					<button data-i18n="settings.exporter" type="submit"></button>
					<p class="form_msg" id="export_err" role="status"></p>
				</form>

				<h3 data-i18n="settings.importer_un_fichier_nfp"></h3>
				<p data-i18n="settings.un_export_de_cette_application_ou_d_une" class="label_info"></p>
				<form method="post" action="api/v2/import" id="f_import">
					<div class="field">
						<input data-i18n-attr="aria-label:settings.fichier_nfp_a_importer" type="file" id="i_import_file" name="file" />
					</div>
					<div class="choice choice_check">
						<input type="checkbox" id="i_import_override" name="override" value="1" />
						<label for="i_import_override">
							<span data-i18n="settings.ecraser_les_jours_deja_renseignes" class="choice_title"></span>
							<span data-i18n="settings.decochee_par_defaut_vos_journees_sont" class="choice_text"></span>
						</label>
					</div>
					<div class="buttons">
						<button data-i18n="settings.verifier_le_fichier" type="button" id="i_import_check"></button>
						<button data-i18n="settings.importer" type="submit" id="i_import_submit"></button>
					</div>
					<p class="form_msg" role="status"></p>
					<p data-i18n="settings.n_ecrit_rien_la_simulation_vous_dit_ce" class="label_info"><b data-i18n="settings.verifier" data-slot="b"></b></p>
				</form>
				<div id="import_report"></div>

				<h3 data-i18n="settings.toutes_mes_donnees_brutes"></h3>
				<p data-i18n="settings.comme_le_demande_le_rgpd_vous_pouvez" class="label_info"></p>
				<a data-i18n="settings.exporter_les_donnees_brutes_de_mon" class="button" id="a_raw_export" href="api/v2/all_of_my_data_plz"></a>
			</section>


			<!-- ===== Connexion et sécurité ===== -->
			<section class="panel" id="panel_connexion" hidden>
				<a data-i18n="settings.reglages_2" class="back" href="#"></a>
				<h2 data-i18n="settings.connexion_et_securite_2"></h2>

				<div class="card">
					<h3 data-i18n="settings.adresse_de_connexion"></h3>
					<p data-i18n="settings.vous_etes_connectee_avec"><b data-slot="b" id="login_email_shown"></b></p>
					<details>
						<summary data-i18n="settings.changer_mon_adresse_de_connexion"></summary>
						<form id="form_login_email" action="api/v2/account" method="post">
							<p data-i18n="settings.elle_sert_a_se_connecter_et_a_retrouver" class="label_info"><b data-i18n="settings.nouvelle" data-slot="b"></b></p>
							<div class="field">
								<label data-i18n="settings.nouvelle_adresse" for="i_login_email_new"></label>
								<input type="email" id="i_login_email_new" name="new_login_email" maxlength="255" required />
								<span data-i18n="settings.n_utilisez_pas_d_adresse_qui_permet_de" class="label_info"></span>
							</div>
							<div class="field">
								<label data-i18n="settings.mot_de_passe" for="i_login_email_password"></label>
								<input type="password" id="i_login_email_password" name="password" autocomplete="current-password" required />
							</div>
							<div class="field" id="login_email_code_field" hidden>
								<label data-i18n="settings.code_d_authentification_multifacteur" for="i_login_email_code"></label>
								<input type="number" id="i_login_email_code" name="code" inputmode="numeric" autocomplete="one-time-code" />
							</div>
							<button data-i18n="settings.envoyer_le_lien" type="submit" id="but_login_email"></button>
							<p class="form_msg" role="status"></p>
						</form>
					</details>
				</div>

				<div class="card">
					<h3 data-i18n="settings.mot_de_passe"></h3>
					<details>
						<summary data-i18n="settings.changer_mon_mot_de_passe"></summary>
						<form id="form_mdp_change" action="api/v2/account" method="post">
							<div class="field">
								<label data-i18n="settings.mot_de_passe_actuel" for="i_old_pw"></label>
								<input type="password" id="i_old_pw" name="old_pw" autocomplete="current-password" required />
							</div>
							<div class="field">
								<label data-i18n="settings.nouveau_mot_de_passe" for="i_pw1"></label>
								<input type="password" id="i_pw1" name="pw1" autocomplete="new-password" required />
								<span data-i18n="settings.10_caracteres_au_moins_avec_une" class="label_info"></span>
							</div>
							<div class="field">
								<label data-i18n="settings.confirmer_le_nouveau_mot_de_passe" for="i_pw2"></label>
								<input type="password" id="i_pw2" name="pw2" autocomplete="new-password" required />
