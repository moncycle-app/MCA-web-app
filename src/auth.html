<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://tableau.moncycle.app/auth" />
		<meta property="og:title" content="MONCYCLE.APP" />
		<meta property="og:description" content="Application de suivi de cycle pour les méthodes naturelles de régulation des naissances." />
		<meta property="og:site_name" content="MONCYCLE.APP" />
		<meta property="og:locale" content="fr_FR" />
		<meta property="og:image" content="https://tableau.moncycle.app/img/preview-fr.e6659340.jpg" />
		<meta property="og:image:secure_url" content="https://tableau.moncycle.app/img/preview-fr.e6659340.jpg" />

		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Carte de moncycle.app : tableau de cycle des méthodes naturelles (auto-observation de la glaire cervicale ou FertilityCare, avec ou sans température), avec une capture du tableau sur téléphone." />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:image" content="https://tableau.moncycle.app/img/preview-fr.e6659340.jpg" />
		<meta name="twitter:image:alt" content="Carte de moncycle.app : tableau de cycle des méthodes naturelles (auto-observation de la glaire cervicale ou FertilityCare, avec ou sans température), avec une capture du tableau sur téléphone." />
		<meta name="theme-color" content="#1e824c" />
		<link rel="canonical" href="https://tableau.moncycle.app/auth" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
		<title data-i18n="auth.moncycle_app_authentification"></title>
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="moncycle.app" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" media="(prefers-color-scheme: light)" content="light-content" />
		<meta name="apple-mobile-web-app-status-bar-style" media="(prefers-color-scheme: dark)" content="dark-content" />
		<meta name="description" content="Application de suivi de cycle pour les méthodes naturelles de régulation des naissances." />
		<script type="text/javascript" src="vendor/jquery.min.js" defer></script>
		<script type="module" src="/js/auth.js"></script>
		<link rel="stylesheet" href="css/commun.css" />
		<link rel="stylesheet" href="css/account.css" />
		<style>
			.contennu {
				max-width: 370px;
			}
		</style>
	</head>
	<body>
		<center>
			<h1>mon<span class="gradiant_logo">cycle</span>.app</h1>
			<a href="register"><button data-i18n="auth.creer_un_compte" type="button" class="nav_button"></button></a>
			<a href="https://www.moncycle.app" target="_blank"><button data-i18n="auth.decouvrir_mon_app" type="button" class="nav_button"><b data-slot="b">CYCLE</b></button></a>
		</center>
		<div class="contennu" id="timeline">
			<h2 data-i18n="auth.connexion_a_votre_compte"></h2>
			<span class="rouge" id="message_err"></span>
			<form method="post" action="api/v2/token" id="connexion_form"><br />
				<!-- what the server is told about this sign-in: the name of the session (js/auth.js writes the domain in it) and that the browser keeps it in a cookie -->
				<input type="hidden" name="name" id="i_token_name" value="WEB-APP" />
				<input type="hidden" name="cookie" id="i_token_cookie" value="true" />
			<label data-i18n="auth.e_mail" for="i_login_email"></label><br />
			<input data-i18n-attr="placeholder:auth.adresse_mail_de_connexion" name="login_email" id="i_login_email" type="email" required  value="" /><br />
			<br />
			<label data-i18n="auth.mot_de_passe" for="i_password"></label><br />
			<input data-i18n-attr="placeholder:auth.mot_de_passe_moncycle_app" name="password" id="i_password" type="password" required  value="" /><br />
			<br />
			<label data-i18n="auth.code" for="i_code"></label><br />
			<input data-i18n-attr="placeholder:auth.authentification_multifacteur_si" name="code" id="i_code" type="number" value="" /><br />
			<br />
			<div id="captcha_wrapper" style="display:none">
				<label data-i18n="auth.captcha" for="i_captcha"></label><br />
				<input data-i18n-attr="placeholder:auth.entrer_les_lettres_ou_chiffres_affiches" name="captcha" id="i_captcha" type="text" maxlength="6" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" /><br />
				<img data-i18n-attr="title:auth.cliquer_pour_obtenir_une_autre_image;alt:auth.captcha_2" class="captcha" id="l_captcha" hidden />
				<input type="hidden" name="captchaToken" id="i_captcha_token" value="" /><br />
				<span data-i18n="auth.majuscules_ou_minuscules_peu_importe" class="label_info"></span><br />
				<br />
			</div>
			<input data-i18n-attr="value:auth.but_connect" type="submit" id="connexion_but"/></form>
			<br /><br /><br />
			<center><a data-i18n="auth.compte_de_demo" class="register_commente" id="but_demo_mucus" href="/auth"><b data-i18n="auth.glaire_cervicale" data-slot="b"></b></a></center>
			<center><a data-i18n="auth.compte_de_demo_2" class="register_commente" id="but_demo_fc" href="/auth"><b data-i18n="auth.fertilitycare" data-slot="b"></b></a></center>
			<br /><br />
			<h2 data-i18n="auth.mot_de_passe_perdu"></h2>
			<span id="password_reseted_msg" class="vert"></span>
			<form method="post" action="api/v2/recover_password" id="reset_form"><br />
				<label data-i18n="auth.e_mail" for="r_login_email"></label><br />
				<input data-i18n-attr="placeholder:auth.adresse_mail_de_connexion" name="login_email" id="r_login_email" type="email" required  value="" /><br />
				<br />
				<label data-i18n="auth.captcha" for="rc_captcha"></label><br />
				<input data-i18n-attr="placeholder:auth.entrer_les_lettres_ou_chiffres_affiches" name="captcha" id="rc_captcha" type="text" maxlength="6" required autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" /><br />
				<img data-i18n-attr="title:auth.cliquer_pour_obtenir_une_autre_image;alt:auth.captcha_2" class="captcha" id="rc_captcha_img" hidden />
				<input type="hidden" name="captchaToken" id="rc_captcha_token" value="" /><br />
				<span data-i18n="auth.l_image_s_affiche_une_fois_l_e_mail" class="label_info"></span><br />
				<br />
				<span class="rouge" id="reset_error_msg"></span><br />
				<input data-i18n-attr="value:auth.but_reset" type="submit" id="reset_but"/></form>
				<br /><br /><br />
			</form>
			
		</div>
		<center>
			<p data-i18n="auth.logiciel_libre_sous_licence" class="label_info"><a data-i18n="auth.agpl_3_0_or_later" data-slot="a" href="https://www.gnu.org/licenses/agpl-3.0.html" target="_blank" rel="noopener noreferrer"></a><a data-i18n="auth.code_source" data-slot="a2" href="https://github.com/moncycle-app" target="_blank" rel="noopener noreferrer"></a><a data-i18n="auth.conditions_d_utilisation" data-slot="a3" id="a_terms" target="_blank" rel="noopener noreferrer" hidden></a></p>
		</center>

	</body>
</html>
