<header class="app_header">
	<h1 class="logo"><img class="logo_mark" src="img/logo.svg" alt="" width="32" height="32" /><span>mon<span class="logo_cycle">cycle</span>.app</span></h1>
	<a data-i18n="auth.create_account" class="nav_button" href="#/register"></a>
	<a data-i18n="auth.discover_app" class="nav_button" href="https://www.moncycle.app" target="_blank" rel="noopener noreferrer"><b data-slot="b">CYCLE</b></a>
</header>
<div class="contennu" id="timeline">
	<h2 data-i18n="auth.signin_title"></h2>
	<span class="rouge" id="message_err"></span>
	<form method="post" action="api/v2/token" id="connexion_form"><br />
		<!-- what the server is told about this sign-in: the name of the session (js/auth.js writes the domain in it) and that the browser keeps it in a cookie -->
		<input type="hidden" name="name" id="i_token_name" value="WEB-APP" />
		<input type="hidden" name="cookie" id="i_token_cookie" value="true" />
	<label data-i18n="auth.email_label" for="i_login_email"></label><br />
	<input data-i18n-attr="placeholder:auth.email_placeholder" name="login_email" id="i_login_email" type="email" required  value="" /><br />
	<br />
	<label data-i18n="auth.password_label" for="i_password"></label><br />
	<input data-i18n-attr="placeholder:auth.password_placeholder" name="password" id="i_password" type="password" required  value="" /><br />
	<br />
	<label data-i18n="auth.code_label" for="i_code"></label><br />
	<input data-i18n-attr="placeholder:auth.code_placeholder" name="code" id="i_code" type="number" value="" /><br />
	<br />
	<div id="captcha_wrapper" hidden>
		<label data-i18n="auth.captcha_label" for="i_captcha"></label><br />
		<input data-i18n-attr="placeholder:auth.captcha_placeholder" name="captcha" id="i_captcha" type="text" maxlength="6" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" /><br />
		<span class="captcha_box"><img data-i18n-attr="title:auth.captcha_image_title;alt:auth.captcha_image_alt" class="captcha" id="l_captcha" /></span>
		<input type="hidden" name="captchaToken" id="i_captcha_token" value="" /><br />
		<span data-i18n="auth.captcha_hint" class="label_info"></span><br />
		<br />
	</div>
	<input data-i18n-attr="value:auth.but_connect" type="submit" id="connexion_but"/></form>
	<br /><br /><br />
	<center><a data-i18n="auth.demo_mucus" class="register_commente" id="but_demo_mucus" href="#/auth"><b data-i18n="auth.cervical_mucus" data-slot="b"></b></a></center>
	<center><a data-i18n="auth.demo_fc" class="register_commente" id="but_demo_fc" href="#/auth"><b data-i18n="auth.fertility_care" data-slot="b"></b></a></center>
	<br /><br />
	<center><a data-i18n="auth.lost_password_link" id="a_recover" href="#/recover"></a></center>
	<br />
</div>

<footer class="app_footer">
	<!-- Someone who is not signed in picks the language here (the screen of the sign-up asks for it first, in its form). -->
	<p class="language_footer">
		<label data-i18n="common.language_label" for="i_language"></label>
		<select id="i_language"></select>
	</p>
	<p data-i18n="common.footer_by" class="label_info"><a data-slot="a" href="https://tech4fertility.org" target="_blank" rel="noopener noreferrer">Tech 4 Fertility</a></p>
	<p data-i18n="auth.footer_licence" class="label_info"><a data-i18n="auth.footer_licence_name" data-slot="a" href="https://www.gnu.org/licenses/agpl-3.0.html" target="_blank" rel="noopener noreferrer"></a><a data-i18n="auth.footer_source_code" data-slot="a2" href="https://github.com/moncycle-app" target="_blank" rel="noopener noreferrer"></a><a data-i18n="auth.footer_terms" data-slot="a3" id="a_footer_terms" target="_blank" rel="noopener noreferrer" hidden></a></p>
</footer>
