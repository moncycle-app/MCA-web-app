<center>
	<h1>mon<span class="gradiant_logo">cycle</span>.app</h1>
	<a href="#/auth"><button data-i18n="recover.back_to_signin" type="button" class="nav_button"></button></a>
	<a href="#/register"><button data-i18n="auth.create_account" type="button" class="nav_button"></button></a>
</center>
<div class="contennu" id="recover">
	<h2 data-i18n="recover.title"></h2>
	<span id="password_reseted_msg" class="vert"></span>
	<form method="post" action="api/v2/recover_password" id="reset_form"><br />
		<span data-i18n="recover.intro"></span><br />
		<br />
		<label data-i18n="recover.email_label" for="r_login_email"></label><br />
		<input data-i18n-attr="placeholder:recover.email_placeholder" name="login_email" id="r_login_email" type="email" required autocomplete="email" value="" /><br />
		<br />
		<label data-i18n="recover.captcha_label" for="rc_captcha"></label><br />
		<input data-i18n-attr="placeholder:recover.captcha_placeholder" name="captcha" id="rc_captcha" type="text" maxlength="6" required autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" /><br />
		<span class="captcha_box"><img data-i18n-attr="title:recover.captcha_image_title;alt:recover.captcha_image_alt" class="captcha" id="rc_captcha_img" /></span>
		<input type="hidden" name="captchaToken" id="rc_captcha_token" value="" /><br />
		<span data-i18n="recover.captcha_hint" class="label_info"></span><br />
		<br />
		<span class="rouge" id="reset_error_msg"></span><br />
		<input data-i18n-attr="value:recover.but" type="submit" id="reset_but" />
	</form>
</div>

<center class="language_footer">
	<label data-i18n="common.language_label" for="i_language"></label>
	<select id="i_language"></select>
</center>
