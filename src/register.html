	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://tableau.moncycle.app/register" />
		<meta property="og:title" content="MONCYCLE.APP" />
		<meta property="og:description" content="Application de suivi de cycle pour les méthodes naturelles de régulation des naissances." />
		<meta property="og:site_name" content="MONCYCLE.APP" />
		<meta property="og:locale" content="fr_FR" />
		<meta property="og:image" content="https://tableau.moncycle.app/img/preview-fr.e6659340.jpg" />
		<meta property="og:image:secure_url" content="https://tableau.moncycle.app/img/preview-fr.e6659340.jpg" />

		<meta property="og:image:width" content="1200" />

		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:image" content="https://tableau.moncycle.app/img/preview-fr.e6659340.jpg" />
		<meta name="twitter:image:alt" content="Carte de moncycle.app : tableau de cycle des méthodes naturelles (auto-observation de la glaire cervicale ou FertilityCare, avec ou sans température), avec une capture du tableau sur téléphone." />
		<meta name="theme-color" content="#1e824c" />
		<link rel="canonical" href="https://tableau.moncycle.app/register" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="moncycle.app" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" media="(prefers-color-scheme: light)" content="light-content" />
		<meta name="apple-mobile-web-app-status-bar-style" media="(prefers-color-scheme: dark)" content="dark-content" />
		<title data-i18n="register.moncycle_app_inscription"></title>
		<meta name="description" content="Application de suivi de cycle pour les méthodes naturelles de régulation des naissances." />
		<link rel="stylesheet" href="css/commun.css" />
		<link rel="stylesheet" href="css/account.css" />
		<script type="text/javascript" src="vendor/jquery.min.js" defer></script>
		<script type="module" src="/js/register.js"></script>
	</head>
	<body>
		<center>
			<h1>mon<span class="gradiant_logo">cycle</span>.app</h1>
			<a href="/auth"><button data-i18n="register.se_connecter" type="button" class="nav_button"></button></a>
			<a class="register_commente" href="https://www.moncycle.app" target="_blank"><button data-i18n="register.decouvrir_moncycle_app" type="button" class="nav_button"></button></a>
			<span class="vert"></span>
			<span class="rouge"></span>
		</center>

		<div class="contennu vert" id="register_ok" style="display:none">
			<center data-i18n="register.un_e_mail_a_ete_envoye_a_l_adresse"><br data-slot="br" /><br data-slot="br2" /><b data-i18n="register.presque_termine" data-slot="b"></b><br data-slot="br3" /><b data-slot="b2"><span id="success_email"></span></b><br data-slot="br4" /><br data-slot="br5" /><br data-slot="br6" /><span data-i18n="register.pas_de_message_regardez_dans_vos" data-slot="span" class="label_info"></span></center>
		</div>
		<div class="contennu" id="register_form">
			<h2 data-i18n="register.creer_votre_compte"></h2>
			<form action="api/v2/register" method="post" id="f_registration"><br />
			<label data-i18n="register.pseudo" for="i_nickname"></label><br />
			<input data-i18n-attr="placeholder:register.ex_vos_initiales_ab" name="nickname" type="text" maxlength="255" id="i_nickname" required /><br />
			<span data-i18n="register.vos_initiales_suffisent_ne_saisissez" class="label_info"></span><br />
			<br />
			<fieldset class="choice_group">
				<legend data-i18n="register.votre_methode"></legend>
				<span data-i18n="register.vous_pourrez_la_changer_a_tout_moment" class="label_info"></span>
				<div class="choice">
					<input type="radio" name="method" value="cervicalMucus" id="m_cervical_mucus" required />
					<label for="m_cervical_mucus">
						<span data-i18n="register.auto_observation_de_la_glaire_cervicale" class="choice_title"></span>
						<span data-i18n="register.vous_notez_chaque_jour_la_sensation_et" class="choice_text"></span>
						<span data-i18n="register.selon_les_publications_des_docteurs" class="choice_note"></span>
					</label>
				</div>
				<div class="choice">
					<input type="radio" name="method" value="fertilityCare" id="m_fertility_care" />
					<label for="m_fertility_care">
						<span data-i18n="register.fertilitycare" class="choice_title"></span>
						<span data-i18n="register.vous_suivez_la_glaire_cervicale_avec_la" class="choice_text"></span>
					</label>
				</div>
			</fieldset>
			<fieldset class="choice_group">
				<legend data-i18n="register.en_option"></legend>
				<div class="choice choice_check">
					<input type="checkbox" name="temperature_tracking" value="1" id="m_temp" />
					<label for="m_temp">
						<span data-i18n="register.suivre_aussi_ma_temperature" class="choice_title"></span>
						<span data-i18n="register.vous_saisissez_votre_temperature" class="choice_text"></span>
					</label>
				</div>
				<span data-i18n="register.vous_suivez_une_methode_symptothermique" class="label_info choice_hint"></span>
			</fieldset>
			<br />
			<label data-i18n="register.e_mail" for="i_login_email"></label><br />
			<input data-i18n-attr="placeholder:register.entrer_votre_adresse_mail" name="login_email" id="i_login_email" type="email" maxlength="255" required /><br />
			<span data-i18n="register.n_utilisez_pas_d_adresse_qui_permet_de" class="label_info"></span><br />
			<br />
			<label data-i18n="register.confirmer_re_saisir_votre_e_mail" for="i_login_email_conf"></label><br />
			<input data-i18n-attr="placeholder:register.entrer_une_2eme_fois_votre_adresse_mail" name="login_email_conf" id="i_login_email_conf" type="email" maxlength="255" required /><br />
			<br />
			<label data-i18n="register.mot_de_passe" for="i_password"></label><br />
			<input data-i18n-attr="placeholder:register.choisir_un_mot_de_passe" name="password" id="i_password" type="password" autocomplete="new-password" required /><br />
			<span data-i18n="register.10_caracteres_au_moins_avec_une" class="label_info"></span><br />
			<br />
			<label data-i18n="register.confirmer_re_saisir_votre_mot_de_passe" for="i_password_conf"></label><br />
			<input data-i18n-attr="placeholder:register.entrer_une_2eme_fois_le_mot_de_passe" name="password_conf" id="i_password_conf" type="password" autocomplete="new-password" required /><br />
			<br />
			<label data-i18n="register.annee_de_naissance" for="i_anaissance"></label><br />
			<select name="birth_year" id="i_anaissance" required placeholder="">
				<option data-i18n="register.selectionner_votre_annee_de_naissance" disabled selected class="placeholder"></option>
			</select><br />
			<br />
			<label data-i18n="register.captcha" for="i_captcha"></label><br />
			<input data-i18n-attr="placeholder:register.entrer_les_lettres_ou_chiffres_affiches" name="captcha" id="i_captcha" type="text" maxlength="6" required autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" /><br />
			<img data-i18n-attr="title:register.cliquer_pour_obtenir_une_autre_image;alt:register.captcha_2" class="captcha" id="r_captcha" hidden />
			<input type="hidden" name="language" id="i_language" value="FR" />
			<input type="hidden" name="captchaToken" id="i_captcha_token" value="" /><br />
			<span data-i18n="register.l_image_s_affiche_une_fois_l_e_mail" class="label_info"></span><br />
			<br />
			<label data-i18n="register.comment_avez_vous_decouvert_moncycle" for="i_comment"></label><br />
			<textarea required id="i_comment" name="discovered_comment" maxlength="255" placeholder="Dites nous tout!"></textarea><br />
			<span data-i18n="register.ne_saisissez_pas_d_informations_de" class="label_info"></span>
			<br />
			<br />
			<span data-i18n="register.conditions_d_utilisation_et_politique"></span><br />
			<iframe data-i18n-attr="title:register.conditions_d_utilisation_et_politique_2" id="f_terms" class="terms_frame" sandbox="allow-popups allow-popups-to-escape-sandbox" referrerpolicy="no-referrer" loading="lazy" hidden></iframe>
			<a data-i18n="register.ouvrir_les_conditions_d_utilisation" id="a_terms" target="_blank" rel="noopener noreferrer" hidden></a>
			<span class="rouge" id="terms_error_msg"></span>
			<p><input type="checkbox" required id="i_terms" name="terms_accepted" value="1" /> <label data-i18n="register.j_ai_lu_et_j_accepte_les_conditions_d" for="i_terms"></label></p>
			<br />
			<input data-i18n-attr="value:register.but_submit" type="submit" id="but_register" /></form>
			<br /><br />
			<span class="rouge" id="register_error_msg" ></span>
			<br /><br /><br /><br />
		</div>
	</body>
</html>
